# Render Blueprint for the CareerPath project.
# Deploy by connecting this repo at https://dashboard.render.com (New +
# Blueprint), or push and let Render auto-detect this file.
services:
  - type: web
    name: careerpath
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn CareerPath.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: careerpath-db
          property: connectionString
      # Optional: enable real role + location job search via Adzuna
      # (free key at https://developer.adzuna.com/). Without these, the Live
      # Jobs page uses the keyless Remotive API, then local data as a fallback.
      # - key: ADZUNA_APP_ID
      #   sync: false
      # - key: ADZUNA_APP_KEY
      #   sync: false
      # - key: ADZUNA_COUNTRY
      #   value: "gb"
      # Optional: override the default admin/admin credentials.
      # - key: ADMIN_USERNAME
      #   sync: false
      # - key: ADMIN_PASSWORD
      #   sync: false

databases:
  - name: careerpath-db
    plan: free
